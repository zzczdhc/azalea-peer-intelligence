[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "azalea-edgar-prototype"
version = "0.1.0"
description = "Small SEC EDGAR financial-text ingestion prototype for NYU CDS Azalea"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
azalea-edgar = "azalea_edgar.__main__:main"
azalea-web = "azalea_edgar.web:main"

[tool.setuptools.packages.find]
include = ["azalea_edgar*"]

[tool.setuptools.package-data]
azalea_edgar = ["static/*"]
